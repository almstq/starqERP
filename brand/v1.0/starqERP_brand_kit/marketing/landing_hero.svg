<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><rect width="1440" height="900" fill="#0A1018"/><g font-family="Noto Sans,Arial,sans-serif" fill="#E7ECF0"><text x="70" y="76" font-size="26" font-weight="800">starqERP</text><text x="70" y="250" font-size="62" font-weight="700">Run the business.</text><text x="70" y="320" font-size="62" font-weight="700">Keep one record.</text><text x="70" y="398" font-size="20" fill="#8F9AA4">Customers, work, stock, purchasing, money and accounting — connected</text><text x="70" y="430" font-size="20" fill="#8F9AA4">for the way Maldivian SMEs actually operate.</text><text x="70" y="486" font-size="17" fill="#8F9AA4">Simple enough to start today. Built so the same business never has to leave it.</text><rect x="70" y="536" width="184" height="50" rx="12" fill="#E09036"/><text x="162" y="567" text-anchor="middle" fill="#111A24" font-size="14" font-weight="800">See how it works</text><text x="286" y="567" font-size="14" fill="#7FBEF3">For Maldivian businesses →</text><rect x="760" y="156" width="606" height="560" rx="22" fill="#111923" stroke="#FFFFFF1A"/><text x="800" y="202" font-size="11" fill="#8F9AA4">DEMO WORKSPACE</text><text x="800" y="248" font-size="24" font-weight="700">What needs attention</text><rect x="800" y="284" width="526" height="92" rx="12" fill="#050911"/><text x="824" y="318" font-size="14" font-weight="700">Invoice INV-1042 is 6 days overdue</text><text x="824" y="347" font-size="12" fill="#8F9AA4">MVR 4,800 remains due</text><rect x="800" y="398" width="526" height="92" rx="12" fill="#050911"/><text x="824" y="432" font-size="14" font-weight="700">Primer Grey has 2 cans left</text><text x="824" y="461" font-size="12" fill="#8F9AA4">Reorder level: 5</text><rect x="800" y="512" width="526" height="92" rx="12" fill="#050911"/><text x="824" y="546" font-size="14" font-weight="700">3 supplier bills may be duplicates</text><text x="824" y="575" font-size="12" fill="#8F9AA4">Review before posting</text><text x="800" y="658" font-size="12" fill="#7FBEF3">AI supports the record. It is not the headline.</text></g></svg>