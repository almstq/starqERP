name: Deployment Mirror Sync

# One-way automatic synchronization from Starq-Technologies-Pvt-Ltd/starqERP (PRIMARY)
# to almstq/starqERP (SECONDARY personal deployment mirror).
# Target for Vercel starq-erp deployment recovery.
#
# Constraints & Governance:
# - One-way flow: PRIMARY main -> mirror main. Reverse sync is impossible and forbidden.
# - Primary authority: Starq-Technologies-Pvt-Ltd/starqERP is the sole engineering source of truth.
# - Mirror role: almstq/starqERP is an automated deployment target only (no PRs, branches, or manual edits).
# - Strict SHA preservation: force-updates mirror main to exact PRIMARY main commit.
# - Security: authenticated via repo-scoped write deploy key (MIRROR_DEPLOY_KEY secret).
# - Repository gate: executes exclusively on Starq-Technologies-Pvt-Ltd/starqERP.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deployment-mirror-sync
  cancel-in-progress: false

jobs:
  sync-mirror:
    name: Sync main to personal deployment mirror
    if: github.repository == 'Starq-Technologies-Pvt-Ltd/starqERP'
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository context and required secret
        id: gate
        run: |
          if [ "${{ github.repository }}" != "Starq-Technologies-Pvt-Ltd/starqERP" ]; then
            echo "Skipping: synchronization only runs on PRIMARY (Starq-Technologies-Pvt-Ltd/starqERP)."
            exit 0
          fi
          if [ -z "${{ secrets.MIRROR_DEPLOY_KEY }}" ]; then
            echo "::error::MIRROR_DEPLOY_KEY secret is missing. Synchronization cannot proceed."
            exit 1
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PRIMARY repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH Deploy Key
        env:
          SSH_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/mirror_deploy_key
          chmod 600 ~/.ssh/mirror_deploy_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push PRIMARY main to mirror main
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/mirror_deploy_key -o StrictHostKeyChecking=yes"
        run: |
          PRIMARY_SHA=$(git rev-parse HEAD)
          echo "Synchronizing PRIMARY main (${PRIMARY_SHA}) to git@github.com:almstq/starqERP.git:main..."
          git push --force git@github.com:almstq/starqERP.git HEAD:refs/heads/main

      - name: Verify SHA equality
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/mirror_deploy_key -o StrictHostKeyChecking=yes"
        run: |
          PRIMARY_SHA=$(git rev-parse HEAD)
          MIRROR_SHA=$(git ls-remote git@github.com:almstq/starqERP.git refs/heads/main | awk '{print $1}')
          echo "PRIMARY main SHA: ${PRIMARY_SHA}"
          echo "MIRROR  main SHA: ${MIRROR_SHA}"
          if [ -z "${MIRROR_SHA}" ]; then
            echo "::error::Could not resolve mirror main SHA!"
            exit 1
          fi
          if [ "${PRIMARY_SHA}" != "${MIRROR_SHA}" ]; then
            echo "::error::SHA mismatch! Expected ${PRIMARY_SHA}, got ${MIRROR_SHA}"
            exit 1
          fi
          echo "SUCCESS: Mirror main verified identical to PRIMARY main (${PRIMARY_SHA})"
