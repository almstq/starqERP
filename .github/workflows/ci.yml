name: starqERP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-contracts:
    name: Backend, Contracts & Governance Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (SERP-382: immutable SHA pin)
        with:
          deno-version: v2.x

      - name: Secret & Credential Sweep
        run: node scripts/pre-push-secret-scan.mjs

      - name: Migration Lineage & Compatibility Linter
        run: node scripts/lint-migrations.mjs

      - name: Migration 0021 Synthetic UUID Rehearsal
        run: node tests/migration_0021_rehearsal.test.mjs

      - name: Tenant Hardcoding Sweep
        run: node tests/tenant_hardcoding_sweep.test.mjs

      - name: Security Policy Tests
        run: node tests/security_policy.test.mjs

      - name: OAuth, Origins & Secrets Verification (SERP-299)
        run: node tests/serp_299_oauth_origins.test.mjs

      - name: Support Policy Tests
        run: node tests/support_policy.test.mjs

      - name: Legal Terms Tests
        run: node tests/legal_terms.test.mjs

      - name: Current Documentation Content Guard
        run: node scripts/lint-documentation-content.mjs

      - name: Reality Mutation Checks
        run: node tests/check_reality_mutation.test.mjs

      - name: Running System Audit Gate
        run: node scripts/audit-running-system.mjs

      - name: UI System Consistency & Design Token Gate
        run: node tests/ui_system_consistency.test.mjs

      - name: UI Adaptive Layout & Responsive Architecture Gate
        run: node tests/ui_responsive_system.test.mjs

      - name: Component Reachability Gate (SERP-234)
        run: node tests/component_reachability.test.mjs

      - name: Reachability Sweep Strict Gate (SERP-392)
        run: node scripts/reachability-sweep.mjs --strict

      - name: Reachability Ratchet Enforcement Gate (SERP-392)
        run: node tests/serp_392_reachability_ratchet.test.mjs

      - name: SERP-314 Gap 2 authenticated Price List boundary test
        run: deno test --allow-read tests/serp314_price_list_edge_path.test.ts

  rls-isolation-probe:
    name: RLS Tenant Isolation Probe (SERP-337)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.6.1.155@sha256:3866d94d8426927e8db3f1c5d790752292bfbe27b5f1f46e199ae1b7d3c1710b
        env:
          POSTGRES_PASSWORD: synthetic-serp124-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: synthetic-serp124-only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
      DATABASE_URL: postgres://postgres:synthetic-serp124-only@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (SERP-382: immutable SHA pin)
        with:
          deno-version: v2.x

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # The Supabase image briefly accepts connections during first-time initialization,
      # then restarts PostgreSQL to apply its bootstrap SQL. A single successful pg_isready
      # can land in that window, so confirm the connection is stable before trusting it
      # (mirrors the wait logic in tests/run_rls_isolation_probe.ps1).
      - name: Wait for PostgreSQL to settle after bootstrap restart
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if psql --set ON_ERROR_STOP=1 --command 'select 1' >/dev/null 2>&1; then
              echo "Connected on attempt $attempt; confirming stability..."
              sleep 5
              if psql --set ON_ERROR_STOP=1 --command 'select 1' >/dev/null 2>&1; then
                echo "PostgreSQL is stable."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "PostgreSQL did not become stable within the wait window." >&2
          exit 1

      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done

      - name: Deno contract suite (all 20 contract files)
        run: >-
          deno test --allow-read --allow-net=localhost:5432,127.0.0.1:5432,127.0.0.1:55432
          --allow-env=DATABASE_URL,STARQBOOKS_SESSION_SECRET,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,PGHOST,PGPORT,PGUSER,PGPASSWORD,PGDATABASE,PGBINARY,PGSSLMODE,PGSSLNEGOTIATION,PGAPPNAME,PGOPTIONS,PGCLIENTENCODING,PGCLIENT_ENCODING,PGREPLICATION,PGSSLROOTCERT,PGSSLKEY,PGSSLCERT,PGSSLCRL,PGCHANNELBINDING,PGTARGETSESSIONATTRS
          tests/contract/

      - name: Load RLS isolation fixture (SERP-124)
        run: psql --set ON_ERROR_STOP=1 --file tests/rls_isolation_fixture.sql

      - name: Run RLS isolation probe (SERP-124 / SERP-337)
        run: psql --set ON_ERROR_STOP=1 --file tests/rls_isolation_probe.sql

      - name: SERP-314 Gap 2 Price List registry probe
        run: psql --set ON_ERROR_STOP=1 --file tests/serp314_price_list_registry_probe.sql

      - name: SERP-460 Accounting event subledger behavioral probe
        run: psql --set ON_ERROR_STOP=1 --file tests/serp460_accounting_event_subledger_probe.sql

      - name: SERP-443 isolation matrix probe
        run: psql --set ON_ERROR_STOP=1 --file tests/serp443_isolation_matrix_probe.sql

  serp-356-payment-concurrency:
    name: SERP-356 Payment Concurrency (refund ceiling / settlement batch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.6.1.155@sha256:3866d94d8426927e8db3f1c5d790752292bfbe27b5f1f46e199ae1b7d3c1710b
        env:
          POSTGRES_PASSWORD: synthetic-serp356-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: synthetic-serp356-only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Same bootstrap-restart window as the RLS job: the Supabase image accepts
      # connections once during first-time init, then restarts to apply its
      # bootstrap SQL. A single pg_isready can land inside that window, so
      # confirm the connection is stable before trusting it.
      - name: Wait for PostgreSQL to settle after bootstrap restart
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if psql --set ON_ERROR_STOP=1 --command 'select 1' >/dev/null 2>&1; then
              echo "Connected on attempt $attempt; confirming stability..."
              sleep 5
              if psql --set ON_ERROR_STOP=1 --command 'select 1' >/dev/null 2>&1; then
                echo "PostgreSQL is stable."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "PostgreSQL did not become stable within the wait window." >&2
          exit 1

      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done

      # The test seeds its own persons / payment_providers / payment_intents /
      # payment_attempts fixtures, so no fixture file is loaded here.
      - name: Set up Python and psycopg
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install "psycopg[binary]"

      # Two transactions are released simultaneously against the same intent and
      # the same settlement batch. Exactly one may commit, and the test asserts
      # the STORED TOTAL afterwards, not merely the absence of an error, because
      # an over-refund is silent until someone reconciles.
      - name: Run SERP-356 payment concurrency test
        run: |
          set -euo pipefail
          python3 tests/test_serp356_payment_concurrency.py \
            --host "$PGHOST" \
            --port 5432 \
            --db "$PGDATABASE" \
            --user "$PGUSER"

      - name: Run settlement allocation concurrency test (SERP-181)
        run: |
          set -euo pipefail
          python3 tests/test_settlement_concurrency.py \
            --host "$PGHOST" --port 5432 --dbname "$PGDATABASE" \
            --user "$PGUSER" --password "$PGPASSWORD"

      - name: Run idempotency replay concurrency test (SERP-182)
        run: |
          set -euo pipefail
          python3 tests/test_idempotency_replay.py \
            --host "$PGHOST" --port 5432 --dbname "$PGDATABASE" \
            --user "$PGUSER" --password "$PGPASSWORD"

      - name: Run document numbering real concurrency test (SERP-176)
        run: |
          set -euo pipefail
          python3 tests/test_document_numbering_real_concurrency.py \
            --host "$PGHOST" --port 5432 --dbname "$PGDATABASE" \
            --user "$PGUSER" --password "$PGPASSWORD"

      - name: Run in-memory document numbering suite
        run: python3 tests/test_document_numbering.py

      - name: Run Python seat-matrix drift detector (SERP-180)
        run: python3 tests/test_seat_matrix.py

  frontend:
    name: Web Frontend Build & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Design token ratchet
        working-directory: .
        run: node scripts/lint-design-tokens.mjs

      - name: Vitest test suite
        run: npm test

      - name: Vite production build
        run: npm run build

  e2e:
    name: Playwright End-to-End Acceptance (SERP-328)
    runs-on: ubuntu-latest
    # Gated behind the unit suite on purpose: browsers take minutes to install,
    # and there is no sense paying for that to learn something `npm test` would
    # have told us in seconds.
    needs: frontend
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # playwright.config.ts starts Vite itself via its webServer block
      # (`vite --mode e2e --port 3001`), so no separate server step is needed.
      # The e2e run is offline by construction: e2e/support/gateway.ts fulfils
      # every /api/* call in-browser, so CI reaches no live backend.
      - name: Playwright acceptance suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 14
